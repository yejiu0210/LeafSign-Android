<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="一叶签（LeafSign）：一个按钮完成每日签到">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4bd8"/>
      <stop offset="0.55" stop-color="#5468ee"/>
      <stop offset="1" stop-color="#8c5bef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbe5"/>
      <stop offset="1" stop-color="#5fe39a"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
    <path id="leafShape" d="M0 -60 C 42 -38, 52 12, 0 60 C -52 12, -42 -38, 0 -60 Z"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- 飘落的叶子 -->
    <g fill="#ffffff" fill-opacity="0.08">
      <use href="#leafShape" transform="translate(560 70) rotate(40) scale(0.9)"/>
      <use href="#leafShape" transform="translate(640 250) rotate(-30) scale(1.3)"/>
      <use href="#leafShape" transform="translate(1160 40) rotate(120) scale(1.1)"/>
      <use href="#leafShape" transform="translate(690 120) rotate(75) scale(0.5)"/>
      <use href="#leafShape" transform="translate(40 300) rotate(15) scale(1.6)"/>
    </g>

    <!-- 左侧：叶子对勾与标题 -->
    <g transform="translate(106 124) rotate(32)">
      <use href="#leafShape" fill="url(#leaf)"/>
      <path d="M-20 4 L-5 20 L22 -16" fill="none" stroke="#2f3bb0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-32)"/>
    </g>
    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#ffffff">
      <text x="176" y="150" font-size="68" font-weight="700">一叶签</text>
      <text x="404" y="150" font-size="24" letter-spacing="2" fill="#dde3ff">LeafSign</text>
      <text x="64" y="218" font-size="24" fill="#ffffff">扫码登录，一个按钮完成每日签到</text>
      <text x="64" y="254" font-size="16" fill="#dde3ff" fill-opacity="0.9">开源 · 完全本地运行 · 只连官方接口</text>
    </g>

    <!-- 右侧：签到清单 -->
    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
      <rect x="760" y="34" width="376" height="252" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <g stroke="#ffffff" stroke-opacity="0.14">
        <line x1="784" y1="84" x2="1112" y2="84"/>
        <line x1="784" y1="134" x2="1112" y2="134"/>
        <line x1="784" y1="184" x2="1112" y2="184"/>
        <line x1="784" y1="234" x2="1112" y2="234"/>
      </g>
      <circle cx="794" cy="59" r="7" fill="#f87171"/>
      <circle cx="794" cy="109" r="7" fill="#60a5fa"/>
      <circle cx="794" cy="159" r="7" fill="#fbbf24"/>
      <circle cx="794" cy="209" r="7" fill="#f9a8d4"/>
      <circle cx="794" cy="259" r="7" fill="#e5e7eb"/>
      <g font-size="19" fill="#ffffff">
        <text x="816" y="66">网易云音乐</text>
        <text x="816" y="116">百度贴吧</text>
        <text x="816" y="166">森空岛</text>
        <text x="816" y="216">哔哩哔哩</text>
        <text x="816" y="266">小黑盒</text>
      </g>
      <g font-size="14" fill="#dde3ff" text-anchor="end">
        <text x="1076" y="64">已签到</text>
        <text x="1076" y="114">已签到</text>
        <text x="1076" y="164">已签到</text>
        <text x="1076" y="214">已签到</text>
        <text x="1076" y="264">已签到</text>
      </g>
      <g>
        <g transform="translate(1100 59)">
          <circle r="13" fill="url(#tick)"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#2f3bb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(1100 109)">
          <circle r="13" fill="url(#tick)"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#2f3bb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(1100 159)">
          <circle r="13" fill="url(#tick)"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#2f3bb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(1100 209)">
          <circle r="13" fill="url(#tick)"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#2f3bb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(1100 259)">
          <circle r="13" fill="url(#tick)"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#2f3bb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#e0e7ff" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
        </g>
      </g>
    </g>
  </g>
</svg>
