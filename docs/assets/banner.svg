<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="一叶签（LeafSign）：一个按钮完成每日签到">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06302b"/>
      <stop offset="0.55" stop-color="#0c5c50"/>
      <stop offset="1" stop-color="#17936f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbe5"/>
      <stop offset="1" stop-color="#5fe39a"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
    <path id="leafShape" d="M0 -60 C 42 -38, 52 12, 0 60 C -52 12, -42 -38, 0 -60 Z"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- 飘落的叶子 -->
    <g fill="#ffffff" fill-opacity="0.07">
      <use href="#leafShape" transform="translate(560 70) rotate(40) scale(0.9)"/>
      <use href="#leafShape" transform="translate(640 250) rotate(-30) scale(1.3)"/>
      <use href="#leafShape" transform="translate(1160 40) rotate(120) scale(1.1)"/>
      <use href="#leafShape" transform="translate(690 120) rotate(75) scale(0.5)"/>
      <use href="#leafShape" transform="translate(40 300) rotate(15) scale(1.6)"/>
    </g>

    <!-- 左侧：图标与标题 -->
    <g transform="translate(106 124) rotate(32)">
      <use href="#leafShape" fill="url(#leaf)"/>
      <path d="M-20 4 L-5 20 L22 -16" fill="none" stroke="#0b5d4b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-32)"/>
    </g>
    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#ffffff">
      <text x="176" y="150" font-size="68" font-weight="700">一叶签</text>
      <text x="404" y="150" font-size="24" letter-spacing="2" fill="#a7f3d0">LeafSign</text>
      <text x="64" y="218" font-size="24" fill="#e7fff3">一个按钮，完成每日签到</text>
      <text x="64" y="254" font-size="16" fill="#a7f3d0" fill-opacity="0.9">Kotlin · Jetpack Compose · 完全本地运行</text>
    </g>

    <!-- 右侧：签到清单 -->
    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
      <rect x="760" y="46" width="376" height="228" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.22"/>
      <g stroke="#ffffff" stroke-opacity="0.12">
        <line x1="784" y1="103" x2="1112" y2="103"/>
        <line x1="784" y1="160" x2="1112" y2="160"/>
        <line x1="784" y1="217" x2="1112" y2="217"/>
      </g>
      <circle cx="794" cy="75" r="7" fill="#f87171"/>
      <circle cx="794" cy="132" r="7" fill="#60a5fa"/>
      <circle cx="794" cy="189" r="7" fill="#fbbf24"/>
      <circle cx="794" cy="246" r="7" fill="#f9a8d4"/>
      <g font-size="19" fill="#ffffff">
        <text x="816" y="82">网易云音乐</text>
        <text x="816" y="139">百度贴吧</text>
        <text x="816" y="196">森空岛</text>
        <text x="816" y="253">哔哩哔哩</text>
      </g>
      <g font-size="14" fill="#a7f3d0" text-anchor="end">
        <text x="1076" y="80">已签到</text>
        <text x="1076" y="137">已签到</text>
        <text x="1076" y="194">已签到</text>
        <text x="1076" y="251">已签到</text>
      </g>
      <g>
        <g transform="translate(1100 75)">
          <circle r="13" fill="#34d399"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#06302b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#6ee7b7" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(1100 132)">
          <circle r="13" fill="#34d399"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#06302b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#6ee7b7" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="0.35s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.35s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(1100 189)">
          <circle r="13" fill="#34d399"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#06302b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#6ee7b7" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
        </g>
        <g transform="translate(1100 246)">
          <circle r="13" fill="#34d399"/>
          <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#06302b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle r="13" fill="none" stroke="#6ee7b7" stroke-width="2"><animate attributeName="r" values="13;22" dur="2.8s" begin="1.05s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1.05s" repeatCount="indefinite"/></circle>
        </g>
      </g>
    </g>
  </g>
</svg>
